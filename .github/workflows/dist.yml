name: Build

on:
  pull_request:
    branches: [ master ]
  push:
    tags:
      - 'v*'

jobs:
  build_wheels:
    name: Build wheels for ${{ matrix.python }} on ${{ matrix.target.os }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
        # Linux
        - os: ubuntu-latest
          arch: x86_64
        - os: ubuntu-26.04-arm
          arch: aarch64

        # Windows
        - os: windows-latest
          arch: AMD64
        - os: windows-11-arm
          arch: ARM64

        # MacOS
        - os: macos-latest
          arch: arm64
        # Python versions for which pre-built wheels are provided
        # See supported versions at https://cibuildwheel.pypa.io/en/stable/#what-does-it-do
        # Be aware that all versions need to be supported by the used version of cibuildwheel
        # https://github.com/pypa/cibuildwheel/releases
        python: [ cp311, cp312, cp313, cp313, cp314, cp314t, cp315, cp315t ]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "${{ matrix.python }}-*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_SKIP: "*musllinux* *win32"
          CIBW_BUILD_VERBOSITY: 1
          # Install the CPU version of torch before installing the rest of the package
          # This prevents it from installing the full CUDA version of torch and associated dependencies (default on Linux)
          # This massively speeds up the installation process and requires much less disk space
          CIBW_BEFORE_TEST: pip install torch --index-url https://download.pytorch.org/whl/cpu
          CIBW_TEST_EXTRAS: dev
          # Tests are much more platform dependant than linting and type checking, so only unit tests are carried out per-platform
          CIBW_TEST_COMMAND: pytest {project}/tests
          # torch has no 3.15 wheels yet; skip tests there so the build still produces artifacts
          # Windows 11 arm builds are being a bitch with installing torch for testing, so that is skipped as well
          CIBW_TEST_SKIP: "cp315-* cp315t-* *-win_arm64"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target.os }}-${{ matrix.python }}
          path: ./wheelhouse/*.whl

  make_sdist:
    name: Make source dist
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Build source dist
      run: python setup.py sdist

    - uses: actions/upload-artifact@v7
      with:
        path: dist/*.tar.gz

  upload_all:
    needs: [ build_wheels, make_sdist ]
    runs-on: ubuntu-24.04
    # Upload to PyPI when pushing new version tag
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: '*'
        path: dist
        merge-multiple: true

    - name: List files to distribute
      run: ls -R dist/
      shell: bash

    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.pypi_password }}

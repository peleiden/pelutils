name: checks

on:
  push:
    paths:
        - pelutils/**.py
        - tests/**.py
        - setup.py
        - pyproject.toml
        - uv.lock
        - MANIFEST.in
        - README.md
        - AGENTS.md
        - .opencode/skills/**
        - docs/**
        - .readthedocs.yaml
        - ruff.toml
        - pyrightconfig.json
        - pytest.ini
        - .github/workflows
        - .coveragerc

  pull_request:
    paths:
        - pelutils/**.py
        - tests/**.py
        - setup.py
        - pyproject.toml
        - uv.lock
        - MANIFEST.in
        - README.md
        - AGENTS.md
        - .opencode/skills/**
        - docs/**
        - .readthedocs.yaml
        - ruff.toml
        - pyrightconfig.json
        - pytest.ini
        - .github/workflows
        - .coveragerc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync development environment with uv
        run: |
          uv sync --python 3.11 --group dev --locked

      - name: Lint
        run: uv run --python 3.11 --locked ruff check pelutils tests

      - name: Format
        run: uv run --python 3.11 --locked ruff format --check pelutils tests

      - name: Type check
        # Not checking types on tests
        # Tests often explicitly check behaviour with wrong types, so it would cause many false positives
        run: uv run --python 3.11 --locked basedpyright pelutils

      - name: Run test
        run: uv run --python 3.11 --locked pytest tests --cov=pelutils

      - name: Upload coverage data to coveralls.io
        run: uv run --python 3.11 --locked coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation
        run: uv run --python 3.11 --locked make --directory docs html
